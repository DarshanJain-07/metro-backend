services:
  citus-coordinator:
    image: citusdata/citus:12.1
    container_name: metro-citus-coordinator
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB: metro_citus
      POSTGRES_USER: metro
      POSTGRES_PASSWORD: metro
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - citus-coordinator-data:/var/lib/postgresql/data

  citus-worker-1:
    image: citusdata/citus:12.1
    container_name: metro-citus-worker-1
    environment:
      POSTGRES_DB: metro_citus
      POSTGRES_USER: metro
      POSTGRES_PASSWORD: metro
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - citus-worker-1-data:/var/lib/postgresql/data

volumes:
  citus-coordinator-data:
  citus-worker-1-data:
